name: Build Ghost Duplicate Finder App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pyinstaller

    - name: Build Standalone EXE with Admin Rights
      run: |
        pyinstaller --noconsole --onefile --uac-admin --name "GhostDuplicateFinder" app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GhostDuplicateFinder-Windows
        path: dist/GhostDuplicateFinder.exe
